name: Publicación

# La aplicación no se publica en ninguna tienda (ADR-020): esta es la única vía
# por la que una versión nueva llega a la tablet.
#
# Antes disparaba con una etiqueta `v*` empujada a mano. Ahora la etiqueta la
# crea semantic-release a partir de los commits, y el disparador es la fusión en
# `main` (ADR-021). Empujar una etiqueta a mano ya no publica nada: el número de
# versión sale de lo que dicen los commits, no de lo que alguien escriba.
on:
  push:
    branches: [main]
  # Para volver a intentarlo cuando la publicación falló por algo de fuera --un
  # secreto mal cargado, un fallo del ejecutor-- sin tener que hacer un commit
  # vacío. Si desde la última etiqueta no hay ningún commit que libere, termina
  # sin publicar.
  workflow_dispatch:

permissions:
  contents: write
  # semantic-release abre una incidencia si la publicación falla. Una tablet que
  # se queda vieja porque nadie miró una corrida en rojo es el fallo silencioso
  # que esto evita.
  issues: write

# Dos fusiones seguidas no pueden repartirse la misma etiqueta.
concurrency:
  group: publicacion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release necesita las etiquetas y todo el historial para
          # saber desde dónde leer los commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Las mismas comprobaciones que la integración continua, y de verdad: esto
      # decía «las mismas» y corría tres de las seis. Una publicación es más
      # difícil de retirar que un cambio -- no se puede despublicar de una
      # tablet que ya la instaló -- así que no se firma nada que no haya pasado
      # por acá. `verificar` las encadena en el mismo orden, y llamarlo en vez
      # de repetirlas evita que las dos listas vuelvan a separarse.
      - name: Las comprobaciones completas
        run: npm run verificar

      - name: Restaurar el almacén de claves
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: tools/release/restaurar-almacen.sh "$RUNNER_TEMP/vse.jks"

      # Decide la versión, compila y firma el APK (tools/release/construir-apk.sh
      # desde el paso `prepare`), y crea la publicación con sus dos adjuntos.
      - name: Publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSE_KEYSTORE_FILE: ${{ runner.temp }}/vse.jks
          VSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # El alias es público --está en docs/actualizacion-en-app.md-- y en un
          # almacén PKCS12 la clave comparte contraseña con el almacén.
          VSE_KEY_ALIAS: vse
          VSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: npx semantic-release
